<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>語音筆記本</title>
  
  <!-- PWA / Web App 設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="語音筆記本" />
  <meta name="theme-color" content="#2563eb" />
  
  <!-- 行動裝置 PWA Manifest (Data URI) -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"語音筆記本","short_name":"語音筆記","start_url":".","display":"standalone","background_color":"#f4f7fb","theme_color":"#2563eb"}' />

  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --border: #dbe3ef;
      --interim: #fff7ed;
      --shadow: 0 10px 25px rgba(30, 64, 175, 0.08);
    }

    * { 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: env(safe-area-inset-top, 16px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 16px) env(safe-area-inset-left, 16px);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, #eff6ff, var(--bg));
      display: flex;
      flex-direction: column;
    }

    .app {
      width: min(800px, 100%);
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    header { 
      margin-bottom: 12px; 
      text-align: center;
    }
    h1 { 
      margin: 6px 0; 
      font-size: clamp(1.4rem, 5vw, 2rem); 
    }
    .subtitle { 
      margin: 0; 
      color: var(--muted); 
      font-size: 0.85rem; 
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: clamp(14px, 4vw, 24px);
      box-shadow: var(--shadow);
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .field { 
      margin-bottom: 14px; 
    }
    .field.flex-grow {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
      font-weight: 700;
      font-size: 0.95rem;
    }
    .hint { 
      color: var(--muted); 
      font-size: 0.75rem; 
      font-weight: 400; 
    }

    textarea {
      display: block;
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      resize: none;
      font-size: 16px; /* 防止 iOS Safari 自動放大 */
      line-height: 1.5;
      color: var(--text);
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      -webkit-overflow-scrolling: touch;
    }
    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .14);
    }
    #temporary { 
      background: var(--interim); 
      min-height: 80px; 
      max-height: 120px;
    }
    #notes { 
      flex: 1;
      min-height: 180px; 
    }

    .toolbar {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    button, select {
      min-height: 48px; /* 手指好按尺寸 */
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
    }
    button:active:not(:disabled) {
      transform: scale(0.98);
      background-color: #f1f5f9;
    }
    button:disabled { 
      cursor: not-allowed; 
      opacity: .45; 
    }

    .primary { 
      color: #fff; 
      background: var(--primary); 
      border-color: var(--primary); 
    }
    .primary:active:not(:disabled) { 
      background: var(--primary-dark); 
    }
    .danger { 
      color: #b91c1c; 
    }

    #status {
      grid-column: span 2;
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.88rem;
      text-align: center;
      background: #f8fafc;
      border-radius: 8px;
      padding: 4px 8px;
    }
    #status.recording { 
      color: #b91c1c; 
      font-weight: 700;
      background: #fef2f2;
    }

    .note { 
      margin-top: 12px; 
      color: var(--muted); 
      font-size: 0.8rem; 
      line-height: 1.4; 
      text-align: center;
    }
    .unsupported { 
      color: #b91c1c; 
      font-weight: 600; 
    }

    @media (min-width: 580px) {
      .toolbar {
        display: flex;
        flex-wrap: wrap;
      }
      .toolbar > button, .toolbar > select {
        flex: 1 1 auto;
      }
      #status {
        flex: 2 1 100%;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>語音筆記本</h1>
      <p class="subtitle">上方顯示即時辨識，下方保留筆記紀錄</p>
    </header>

    <section class="card" aria-label="語音筆記工具">
      <div class="field">
        <label for="temporary">
          <span>暫存區</span>
          <span class="hint">辨識中的內容即時顯示於此</span>
        </label>
        <textarea id="temporary" readonly placeholder="按下「開始語音」後說話……"></textarea>
      </div>

      <div class="field flex-grow">
        <label for="notes">
          <span>筆記內容</span>
          <span class="hint">可手動編輯或貼上</span>
        </label>
        <textarea id="notes" placeholder="辨識完成的內容會加入這裡……"></textarea>
      </div>

      <div class="toolbar">
        <button id="startBtn" class="primary" type="button">開始語音</button>
        <button id="stopBtn" type="button" disabled>停止</button>
        <button id="clearTempBtn" type="button">清除暫存</button>
        <button id="clearNotesBtn" class="danger" type="button">清除筆記</button>
        <select id="language" aria-label="辨識語言">
          <option value="zh-TW">中文（台灣）</option>
          <option value="zh-CN">中文（普通話）</option>
          <option value="en-US">English (US)</option>
          <option value="ja-JP">日本語</option>
        </select>
        <div id="status" role="status" aria-live="polite">準備就緒</div>
      </div>

      <p id="supportNote" class="note">提示：請允許麥克風權限。建議使用 Safari (iOS) 或 Chrome (Android)。</p>
    </section>
  </main>

  <script>
    (() => {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const temporary = document.getElementById('temporary');
      const notes = document.getElementById('notes');
      const startBtn = document.getElementById('startBtn');
      const stopBtn = document.getElementById('stopBtn');
      const clearTempBtn = document.getElementById('clearTempBtn');
      const clearNotesBtn = document.getElementById('clearNotesBtn');
      const language = document.getElementById('language');
      const status = document.getElementById('status');
      const supportNote = document.getElementById('supportNote');

      let wakeLock = null;

      // 防休眠鎖
      async function requestWakeLock() {
        if ('wakeLock' in navigator) {
          try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
        }
      }
      function releaseWakeLock() {
        if (wakeLock) { wakeLock.release(); wakeLock = null; }
      }

      if (!SpeechRecognition) {
        startBtn.disabled = true;
        stopBtn.disabled = true;
        supportNote.innerHTML = '<span class="unsupported">此手機瀏覽器不支援語音辨識。</span><br>iOS 請用 Safari，Android 請用 Chrome。';
        status.textContent = '語音功能不可用';
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = language.value;

      let isRecording = false;

      language.addEventListener('change', () => {
        recognition.lang = language.value;
        if (isRecording) {
          recognition.stop();
          status.textContent = '語言已變更，請重新開始';
        }
      });

      startBtn.addEventListener('click', () => {
        temporary.value = '';
        recognition.lang = language.value;
        try { 
          recognition.start(); 
        } catch (error) {}
      });

      stopBtn.addEventListener('click', () => recognition.stop());

      clearTempBtn.addEventListener('click', () => { temporary.value = ''; });

      clearNotesBtn.addEventListener('click', () => {
        if (notes.value && !window.confirm('確定要清除全部筆記嗎？')) return;
        notes.value = '';
      });

      recognition.onstart = () => {
        isRecording = true;
        startBtn.disabled = true;
        stopBtn.disabled = false;
        status.classList.add('recording');
        status.textContent = '正在聆聽中……';
        requestWakeLock();
      };

      recognition.onresult = (event) => {
        let interimText = '';
        let newFinalText = '';

        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            newFinalText += transcript;
          } else {
            interimText += transcript;
          }
        }

        temporary.value = interimText;

        if (newFinalText) {
          const needsSpace = notes.value && !/\s$/.test(notes.value) && /^[a-zA-Z0-9]/.test(newFinalText);
          notes.value += (needsSpace ? ' ' : '') + newFinalText;
          notes.scrollTop = notes.scrollHeight;
        }
      };

      recognition.onerror = (event) => {
        const messages = {
          'not-allowed': '請允許麥克風權限以進行語音輸入。',
          'audio-capture': '找不到可用的麥克風。',
          'no-speech': '未偵測到聲音，請再試一次。',
          'network': '語音服務需要網路連線。'
        };
        status.textContent = messages[event.error] || `辨識錯誤：${event.error}`;
      };

      recognition.onend = () => {
        isRecording = false;
        startBtn.disabled = false;
        stopBtn.disabled = true;
        status.classList.remove('recording');
        if (status.textContent === '正在聆聽中……') {
          status.textContent = '已停止';
        }
        releaseWakeLock();
      };
    })();
  </script>
</body>
</html>
